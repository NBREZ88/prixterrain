<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrixTerrain</title>
<link rel="manifest" href="manifeste.json">
<meta name="theme-color" content="#2f6f3e">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PrixTerrain">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; color: #1b1b1b; background: #fff; }
  #application { max-width: 34rem; margin: 0 auto; padding: 1rem 1rem 5rem; }
  h1 { font-size: 1.5rem; margin: 0 0 1.25rem; }
  .champ { margin-bottom: 1.1rem; }
  .etiquette { display: block; font-size: .95rem; font-weight: 600; margin-bottom: .35rem; }
  .saisie { width: 100%; box-sizing: border-box; font-size: 1.15rem; padding: .7rem .75rem;
            border: 1px solid #9a9a9a; border-radius: .4rem; background: #fff; }
  .saisie:focus { outline: 3px solid #2f6f3e; outline-offset: 1px; }
  .enregistrer { width: 100%; font-size: 1.2rem; font-weight: 600; padding: .95rem;
                 background: #2f6f3e; color: #fff; border: 0; border-radius: .5rem; cursor: pointer; }
  .lien { background: none; border: 0; color: #2f6f3e; font-size: 1rem;
          text-decoration: underline; cursor: pointer; padding: .35rem 0; }
  .alerte { background: #fdf0e5; border-left: 4px solid #b35c00; padding: .7rem .8rem; margin: 0 0 .9rem; }
  .confirmation { background: #eaf4ec; border-left: 4px solid #2f6f3e; padding: .7rem .8rem; margin: 0 0 .9rem; }
  .etat { background: #f4f6f4; border: 1px solid #d8d8d8; border-radius: .4rem; padding: .8rem; margin-bottom: 1rem; }
  .etat p { margin: .2rem 0; }
  .bandeau { margin-bottom: 1.25rem; }
  .attente { margin: .25rem 0 0; color: #8a5a00; font-size: .95rem; }
  .ligne-prix { display: flex; align-items: center; gap: .6rem; }
  .ligne-prix .saisie { flex: 1; }
  .unite { font-size: 1.05rem; color: #444; white-space: nowrap; }
  .choix-fait { display: flex; align-items: center; justify-content: space-between; gap: .75rem;
                border: 1px solid #cfcfcf; border-radius: .4rem; padding: .7rem .75rem; background: #f4f6f4; }
  .choix-nom { font-size: 1.1rem; }
  .propositions { margin-top: .4rem; border: 1px solid #cfcfcf; border-radius: .4rem; overflow: hidden; }
  .proposition { display: block; width: 100%; text-align: left; background: #fff; border: 0;
                 border-bottom: 1px solid #ececec; padding: .7rem .75rem; font-size: 1.05rem; cursor: pointer; }
  .aucune { margin: 0; padding: .7rem .75rem; color: #666; }
  .creation { display: block; width: 100%; text-align: left; padding: .7rem .75rem; background: #f7f7f7; }
  .details { margin: .25rem 0 1rem; }
  .repli { border-left: 3px solid #d8d8d8; padding-left: .85rem; margin-bottom: 1rem; }
  .fenetre { position: fixed; inset: 0; background: rgba(0,0,0,.45);
             display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .fenetre-contenu { background: #fff; border-radius: .6rem; padding: 1.1rem; width: 100%; max-width: 26rem; }
  .fenetre-contenu h2 { font-size: 1.15rem; margin: 0 0 1rem; }
  .boutons-fenetre { display: flex; align-items: center; gap: 1rem; justify-content: space-between; }
  .boutons-fenetre .enregistrer { width: auto; padding: .8rem 1.4rem; }
  .menu { display: flex; gap: .5rem; border-bottom: 1px solid #d8d8d8; margin-bottom: 1rem; }
  .menu button { background: none; border: 0; border-bottom: 3px solid transparent;
                 font-size: 1rem; padding: .6rem .3rem; cursor: pointer; color: #444; }
  .menu button.actif { border-bottom-color: #2f6f3e; color: #2f6f3e; font-weight: 600; }
  .onglets { display: flex; gap: .5rem; margin-bottom: 1rem; }
  .onglet { background: #f2f2f2; border: 1px solid #d8d8d8; border-radius: .4rem;
            padding: .5rem .8rem; font-size: 1rem; cursor: pointer; }
  .onglet.actif { background: #2f6f3e; border-color: #2f6f3e; color: #fff; }
  .groupe { border: 1px solid #cfcfcf; border-radius: .4rem; padding: .6rem .75rem; margin-bottom: .8rem; }
  .ligne-fiche { display: flex; align-items: center; justify-content: space-between;
                 gap: .75rem; padding: .35rem 0; }
  .appui { display: block; font-size: .9rem; color: #666; }
  .pied { margin-top: 2rem; border-top: 1px solid #ececec; padding-top: .5rem; }
  .entete-produit { margin-bottom: 1rem; }
  .entete-produit h2 { margin: 0; font-size: 1.25rem; }
  .titre-bloc { margin: 0 0 .5rem; font-weight: 600; }
  .valeur-moyenne { margin: 0 0 .6rem; font-size: 1.1rem; }
  .valeur-absente { margin: 0 0 .6rem; color: #8a5a00; }
  .liste-releves { margin: 0; padding-left: 1.1rem; }
  .liste-releves li { margin-bottom: .25rem; }
  .liste-releves li.atypique { color: #8a5a00; }
  .marque { font-weight: 600; }
  .manquant { background: #f6f2ea; border-left: 4px solid #a08a5a; padding: .6rem .8rem; margin-bottom: .8rem; }
  .manquant-nom { margin: 0; font-weight: 600; }
  .manquant-suite { margin: .2rem 0 0; color: #555; font-size: .95rem; }
  .bloc-courbe { margin: 1.2rem 0; }
  .courbe { width: 100%; height: auto; background: #fbfbfb; border: 1px solid #ececec; border-radius: .4rem; }
  .legende { display: flex; flex-wrap: wrap; gap: .8rem; margin-top: .4rem; font-size: .95rem; }
  .legende-entree { display: flex; align-items: center; gap: .35rem; }
  .pastille { width: .8rem; height: .8rem; border-radius: 50%; display: inline-block; }
  .titre-section { margin: 1.4rem 0 .6rem; font-weight: 600; color: #2f6f3e;
                   border-bottom: 1px solid #ececec; padding-bottom: .2rem; }
  .bouton-etroit { width: auto; padding: .7rem 1.1rem; font-size: 1rem; }
  .pied-reglages { margin-top: 1.5rem; }
  .etiquette-case { font-size: 1rem; }
</style>
</head>
<body>

<div id="application"><p>Un instant…</p></div>

<script>
// Retient l'invitation d'installation du navigateur pour l'écran Compte.
window.PrixTerrainInstallation = { invite: null };
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  window.PrixTerrainInstallation.invite = e;
});

// Garde une copie de l'application sur l'appareil, pour l'ouvrir sans réseau.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js');
  });
}
</script>

<script src="dexie.min.js"></script>
<script src="supabase.js"></script>
<script src="configuration.js"></script>
<script src="base.js"></script>
<script src="saisie.js"></script>
<script src="rapprochement.js"></script>
<script src="consultation.js"></script>
<script src="tiers.js"></script>
<script src="reglages.js"></script>
<script src="export.js"></script>
<script src="comptes.js"></script>

<script>
// PrixTerrain — ouverture de session et passage d'un écran à l'autre.
(function () {
  'use strict';
  var A = window.PrixTerrain;
  var zone = document.getElementById('application');

  function echapper(t) {
    return String(t).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  // ---------------------------------------------------------------------
  // Ouverture de session
  // ---------------------------------------------------------------------
  function ecranSession(alerte) {
    zone.innerHTML =
      '<h1>PrixTerrain</h1>' +
      '<p class="appui">Relevé et suivi des prix d\'intrants agricoles.</p>' +
      (alerte ? '<p class="alerte">' + echapper(alerte) + '</p>' : '') +
      '<div class="champ"><span class="etiquette">Votre adresse</span>' +
      '<input class="saisie" type="email" id="adresse" autocomplete="username"></div>' +
      '<div class="champ"><span class="etiquette">Votre mot de passe</span>' +
      '<input class="saisie" type="password" id="motdepasse" autocomplete="current-password"></div>' +
      '<button class="enregistrer" id="entrer">Entrer</button>' +
      '<p class="manquant-suite">Mot de passe oublié ou perdu : demandez-en un nouveau au ' +
      'responsable de l\'application. Aucun courriel n\'est envoyé par PrixTerrain.</p>';

    var champAdresse = document.getElementById('adresse');
    var champMotDePasse = document.getElementById('motdepasse');
    var boutonEntrer = document.getElementById('entrer');

    champMotDePasse.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') boutonEntrer.click();
    });

    boutonEntrer.addEventListener('click', function () {
      var adresse = champAdresse.value.trim();
      var motDePasse = champMotDePasse.value;
      if (!adresse || !motDePasse) {
        ecranSession('Entrez votre adresse et votre mot de passe.');
        return;
      }
      if (!navigator.onLine) {
        ecranSession("Pas de réseau pour l'instant. La première ouverture de session en demande.");
        return;
      }

      boutonEntrer.disabled = true;
      boutonEntrer.textContent = 'Un instant…';

      A.base.auth.signInWithPassword({ email: adresse, password: motDePasse })
        .then(function (r) {
          if (r.error) throw r.error;
          return A.base.from('profil').select('*').eq('id', r.data.user.id).limit(1)
            .then(function (f) {
              if (f.error) throw f.error;
              return { utilisateur: r.data.user, fiche: f.data[0] || null };
            });
        })
        .then(function (retour) {
          if (retour.fiche) return entrer(retour.fiche);
          return ecranPremiereFois(retour.utilisateur);
        })
        .catch(function (erreur) { ecranSession(A.messageSimple(erreur)); });
    });
  }

  // Première ouverture d'un compte : la fiche de conseiller se crée ici,
  // sans intervention du responsable.
  function ecranPremiereFois(utilisateur) {
    zone.innerHTML =
      '<h1>Bienvenue</h1>' +
      '<p>Votre nom apparaîtra à côté des relevés que vous saisirez, ' +
      'pour que l\'équipe sache qui a relevé quel prix.</p>' +
      '<div class="champ"><span class="etiquette">Votre nom et prénom</span>' +
      '<input class="saisie" type="text" id="nom" placeholder="Marie Dupont"></div>' +
      '<p class="alerte" id="alerte-nom" style="display:none"></p>' +
      '<button class="enregistrer" id="valider">Continuer</button>';

    var alerte = document.getElementById('alerte-nom');
    document.getElementById('valider').addEventListener('click', function () {
      var nom = document.getElementById('nom').value.trim();
      if (nom.length < 3) {
        alerte.textContent = 'Entrez votre nom et votre prénom.';
        alerte.style.display = 'block';
        return;
      }
      var bouton = this;
      bouton.disabled = true;
      bouton.textContent = 'Un instant…';

      A.base.from('profil')
        .insert({ id: utilisateur.id, nom: nom, courriel: utilisateur.email })
        .select()
        .then(function (r) {
          if (r.error) throw r.error;
          return entrer(r.data[0]);
        })
        .catch(function (erreur) {
          bouton.disabled = false;
          bouton.textContent = 'Continuer';
          alerte.textContent = A.messageSimple(erreur);
          alerte.style.display = 'block';
        });
    });
  }

  function entrer(fiche) {
    return A.memoriserCompte(fiche).then(function () {
      A.demarrerSynchronisation();
      ouvrirApplication(fiche);
      return A.synchroniser().then(function () { return rafraichirCompte(fiche); });
    });
  }

  // Le rôle peut avoir changé côté équipe depuis la dernière ouverture.
  function rafraichirCompte(fiche) {
    return A.bd.profil.get(fiche.id).then(function (aJour) {
      if (!aJour) return;
      if (aJour.role === fiche.role && aJour.nom === fiche.nom && aJour.actif === fiche.actif) return;
      return A.memoriserCompte(aJour).then(function () { ouvrirApplication(aJour); });
    });
  }

  // ---------------------------------------------------------------------
  // Passage d'un écran à l'autre
  // ---------------------------------------------------------------------
  function ouvrirApplication(compte) {
    var ecrans = [
      { nom: 'saisie',        libelle: 'Saisie',   afficher: A.afficherSaisie },
      { nom: 'consultation',  libelle: 'Prix',     afficher: A.afficherConsultation },
      { nom: 'tiers',         libelle: 'Qui',      afficher: A.afficherTiers },
      { nom: 'rapprochement', libelle: 'Doublons', afficher: A.afficherRapprochement },
      { nom: 'export',        libelle: 'Export',   afficher: A.afficherExport },
      { nom: 'reglages',      libelle: 'Réglages', afficher: A.afficherReglages, reserve: 'administrateur' },
      { nom: 'comptes',       libelle: 'Compte',   afficher: A.afficherComptes }
    ];

    var visibles = ecrans.filter(function (ecran) {
      return !ecran.reserve || compte.role === ecran.reserve;
    });
    var ecranCourant = visibles[0].nom;

    function dessiner() {
      zone.innerHTML = '';

      var menu = document.createElement('div');
      menu.className = 'menu';
      visibles.forEach(function (ecran) {
        var onglet = document.createElement('button');
        onglet.type = 'button';
        onglet.textContent = ecran.libelle;
        if (ecran.nom === ecranCourant) onglet.className = 'actif';
        onglet.addEventListener('click', function () { ecranCourant = ecran.nom; dessiner(); });
        menu.appendChild(onglet);
      });
      zone.appendChild(menu);

      var contenu = document.createElement('div');
      zone.appendChild(contenu);

      visibles.forEach(function (ecran) {
        if (ecran.nom === ecranCourant) ecran.afficher(contenu, compte);
      });
    }

    dessiner();
  }

  // ---------------------------------------------------------------------
  // Démarrage
  // ---------------------------------------------------------------------
  if (!A.configurationComplete) {
    zone.innerHTML = '<p class="alerte">L\'adresse de la base d\'équipe n\'est pas renseignée sur cet appareil.</p>';
    return;
  }

  A.compteLocal().then(function (compte) {
    if (!compte) { ecranSession(null); return; }
    A.demarrerSynchronisation();
    ouvrirApplication(compte);
    rafraichirCompte(compte);
  }).catch(function () {
    zone.innerHTML = '<p class="alerte">Cet appareil refuse de conserver les saisies. ' +
                     'Ouvrez l\'application depuis son adresse internet plutôt que depuis un fichier.</p>';
  });
})();
</script>

</body>
</html>
